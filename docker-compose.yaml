version: '3.8'

services:
  # 1. Database PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: laravel_postgres
    environment:
      POSTGRES_DB: task-manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: obim1234
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  # 2. Laravel Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile  # Perhatikan huruf besar/kecil (biasanya dockerfile, bukan DockerFile)
    container_name: laravel_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www
    env_file:
      - .env  # Asumsinya .env ada di folder luar (sejajar compose), ganti ke ./backend/.env jika ada di dalam folder backend
    environment:
      - DB_HOST=postgres  # Langsung arahkan ke nama service postgres
    depends_on:
      - postgres
    networks:
      - app-network

  # 3. Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nextjs_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/.next
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata: